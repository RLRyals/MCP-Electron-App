name: Test Claude Desktop Skill Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'claude-desktop-skills/**'
      - '.github/workflows/test-skill-build.yml'

jobs:
  build-skill:
    name: Build Claude Desktop Skill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Claude Desktop Skill ZIP
        run: |
          cd claude-desktop-skills
          zip -r fictionlab-workflow.zip fictionlab-workflow/

          # Generate checksum
          sha256sum fictionlab-workflow.zip > fictionlab-workflow.zip.sha256

          echo "Created skill ZIP:"
          ls -lh fictionlab-workflow.zip
          echo ""
          echo "SHA256 checksum:"
          cat fictionlab-workflow.zip.sha256

      - name: Test ZIP structure
        run: |
          cd claude-desktop-skills
          echo "Testing ZIP contents..."
          unzip -l fictionlab-workflow.zip

          echo ""
          echo "Extracting to verify structure..."
          mkdir -p test-extract
          cd test-extract
          unzip ../fictionlab-workflow.zip

          echo ""
          echo "Verifying required files exist..."
          if [ ! -f "fictionlab-workflow/skill.md" ]; then
            echo "ERROR: skill.md not found"
            exit 1
          fi
          if [ ! -f "fictionlab-workflow/ipc-client.js" ]; then
            echo "ERROR: ipc-client.js not found"
            exit 1
          fi
          if [ ! -f "fictionlab-workflow/README.md" ]; then
            echo "ERROR: README.md not found"
            exit 1
          fi
          if [ ! -f "fictionlab-workflow/QUICKSTART.md" ]; then
            echo "ERROR: QUICKSTART.md not found"
            exit 1
          fi

          echo "✓ All required files present"
          echo ""
          echo "Final structure:"
          ls -lR fictionlab-workflow/

      - name: Upload skill ZIP for testing
        uses: actions/upload-artifact@v4
        with:
          name: fictionlab-workflow-test
          path: |
            claude-desktop-skills/fictionlab-workflow.zip
            claude-desktop-skills/fictionlab-workflow.zip.sha256
          retention-days: 7

      - name: Build summary
        run: |
          cd claude-desktop-skills
          FILE_SIZE=$(du -h fictionlab-workflow.zip | cut -f1)
          CHECKSUM=$(cat fictionlab-workflow.zip.sha256 | cut -d' ' -f1)

          echo "## Build Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**File**: fictionlab-workflow.zip" >> $GITHUB_STEP_SUMMARY
          echo "**Size**: $FILE_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "**SHA256**: \`$CHECKSUM\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the artifact from the Actions tab to test the skill." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Installation" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the artifact ZIP" >> $GITHUB_STEP_SUMMARY
          echo "2. Extract \`fictionlab-workflow.zip\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Copy \`fictionlab-workflow\` folder to Claude Desktop skills directory" >> $GITHUB_STEP_SUMMARY
          echo "4. Restart Claude Desktop" >> $GITHUB_STEP_SUMMARY
          echo "5. Test: \`/fictionlab-workflow list\`" >> $GITHUB_STEP_SUMMARY

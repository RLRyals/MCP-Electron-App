name: Release Electron App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

# The default GITHUB_TOKEN is read-only in this repo; creating the release
# (softprops/action-gh-release) needs contents: write.
permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm run test:ci

      - name: Run full test suite (informational)
        id: full_tests
        continue-on-error: true
        run: npm test

      - name: Note pre-existing test failures
        if: steps.full_tests.outcome == 'failure'
        run: |
          echo "::warning::Full suite (npm test) has pre-existing failures tracked in issue #176; not blocking this release build. The required gate above (npm run test:ci) covers the currently-green suites and does block on regressions there. See the 'Run full test suite' step log for detail."

      - name: Install Playwright browsers
        run: |
          npx playwright install chromium --with-deps

      - name: Run Electron E2E smoke tests (issue #208, bead mea-eed)
        # playwright.config.ts testDir is e2e/, so this runs every *.spec.ts
        # there: the launch-only smoke test (smoke.spec.ts) plus the
        # pluginless core smoke test (pluginless.spec.ts) that gates a
        # zero-plugins install against dangling plugin-view references.
        run: |
          npm run test:e2e

      - name: Build Windows app
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Generate checksums
        shell: powershell
        run: |
          $releaseDir = Join-Path $PWD 'out\release'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          # Issue #223: this used to be -Recurse over the whole 'out' tree, which
          # also swept up out/win-unpacked/FictionLab.exe (bare app exe) plus NSIS
          # helper binaries (elevate.exe, pagent.exe) and shipped them as release
          # assets alongside the real installer. electron-builder's nsis target
          # writes the actual installer directly under out/ (default artifactName
          # "${productName} Setup ${version}.${ext}" -> "FictionLab Setup X.Y.Z.exe",
          # verified against package.json's build.nsis config, which has no
          # artifactName override). Scoping to the top level of out/ (no -Recurse)
          # already excludes win-unpacked/; the *Setup*.exe filter is a second,
          # explicit guard against any other top-level .exe.
          Get-ChildItem -Path (Join-Path $PWD 'out') -Filter '*Setup*.exe' -File |
            ForEach-Object {
              $hash = Get-FileHash -Path $_.FullName -Algorithm SHA256
              $filename = $_.Name
              "$($hash.Hash.ToLower())  $filename" | Out-File -Append -FilePath (Join-Path $PWD 'out\checksums-windows.txt') -Encoding utf8

              $dest = Join-Path $releaseDir $filename
              Copy-Item -Path $_.FullName -Destination $dest -Force
            }

          Get-Content out/checksums-windows.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            out/release/*.exe
            out/checksums-windows.txt
          retention-days: 1

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm run test:ci

      - name: Run full test suite (informational)
        id: full_tests
        continue-on-error: true
        run: npm test

      - name: Note pre-existing test failures
        if: steps.full_tests.outcome == 'failure'
        run: |
          echo "::warning::Full suite (npm test) has pre-existing failures tracked in issue #176; not blocking this release build. The required gate above (npm run test:ci) covers the currently-green suites and does block on regressions there. See the 'Run full test suite' step log for detail."

      - name: Build macOS app
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Generate checksums
        run: |
          cd out
          find . -type f \( -name "*.dmg" -o -name "*.zip" \) -exec sh -c '
            for file; do
              filename=$(basename "$file")
              shasum -a 256 "$file" | sed "s|$file|$filename|" >> checksums-macos.txt
            done
          ' sh {} +
          cat checksums-macos.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            out/*.dmg
            out/*.zip
            out/checksums-macos.txt
          retention-days: 1

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm run test:ci

      - name: Run full test suite (informational)
        id: full_tests
        continue-on-error: true
        run: npm test

      - name: Note pre-existing test failures
        if: steps.full_tests.outcome == 'failure'
        run: |
          echo "::warning::Full suite (npm test) has pre-existing failures tracked in issue #176; not blocking this release build. The required gate above (npm run test:ci) covers the currently-green suites and does block on regressions there. See the 'Run full test suite' step log for detail."

      - name: Build Linux app
        run: npm run package:linux

      - name: Generate checksums
        run: |
          cd out
          find . -type f \( -name "*.AppImage" -o -name "*.deb" \) -exec sh -c '
            for file; do
              filename=$(basename "$file")
              sha256sum "$file" | sed "s|$file|$filename|" >> checksums-linux.txt
            done
          ' sh {} +
          cat checksums-linux.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            out/*.AppImage
            out/*.deb
            out/checksums-linux.txt
          retention-days: 1

  create-release:
    name: Create Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: always() && needs.build-windows.result == 'success' && needs.build-macos.result == 'success' && needs.build-linux.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: release-assets/macos

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-installer
          path: release-assets/linux

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -lR release-assets/

      # The "What's Changed" changelog is auto-generated by GitHub from PR
      # titles via `generate_release_notes: true` on the Create Release step
      # (bead mea-1j9 -- the in-app What's New panel renders that body).
      # softprops/action-gh-release PREPENDS this body_path content to the
      # generated notes, so this file only carries the static
      # installation/checksum guidance.
      - name: Generate release notes
        id: release_notes
        run: |
          cat << EOF > release_notes.md
          ## Installation

          **Windows**: Download and run the installer executable.

          **macOS**: Download the DMG file, mount it, and drag the app to Applications.

          **Linux AppImage**: Download the AppImage file, make it executable, and run:
          \`\`\`bash
          chmod +x FictionLab-*.AppImage
          ./FictionLab-*.AppImage
          \`\`\`

          **Linux Debian/Ubuntu**: Download and install the .deb package:
          \`\`\`bash
          sudo dpkg -i fictionlab_*.deb
          \`\`\`

          ## Checksums (SHA256)

          Checksums are included in the \`checksums-*.txt\` files for verification.

          ## Notes

          - Code signing certificates are not yet configured (Windows and macOS may show security warnings)
          - Please verify checksums before installation
          EOF

          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: FictionLab ${{ steps.get_version.outputs.version }}
          body_path: release_notes.md
          # Auto-generate the "What's Changed" changelog from merged PR
          # titles (appended after the body above) -- bead mea-1j9.
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, 'alpha') || contains(steps.get_version.outputs.version, 'beta') || contains(steps.get_version.outputs.version, 'rc') }}
          files: |
            release-assets/windows/**/*Setup*.exe
            release-assets/windows/checksums-windows.txt
            release-assets/macos/*.dmg
            release-assets/macos/*.zip
            release-assets/macos/checksums-macos.txt
            release-assets/linux/*.AppImage
            release-assets/linux/*.deb
            release-assets/linux/checksums-linux.txt

  release-complete:
    name: Release Complete
    needs: [create-release]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check release status
        run: |
          if [ "${{ needs.create-release.result }}" != "success" ]; then
            echo "::error::Release creation failed"
            echo "Release: ${{ needs.create-release.result }}"
            exit 1
          fi
          echo "::notice::Release completed successfully!"

name: Release Electron App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout MCP-Electron-App
        uses: actions/checkout@v4
        with:
          path: MCP-Electron-App

      - name: Checkout fictionlab-workflow
        uses: actions/checkout@v4
        with:
          repository: RLRyals/fictionlab-workflow
          path: fictionlab-workflow
          token: ${{ secrets.WORKFLOW_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: MCP-Electron-App/package-lock.json

      - name: Install and build workflow packages
        working-directory: fictionlab-workflow
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        working-directory: MCP-Electron-App
        run: npm ci

      - name: Build TypeScript
        working-directory: MCP-Electron-App
        run: npm run build

      - name: Build Windows app
        working-directory: MCP-Electron-App
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Generate checksums
        shell: powershell
        working-directory: MCP-Electron-App
        run: |
          $releaseDir = Join-Path $PWD 'out\release'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          Get-ChildItem -Path (Join-Path $PWD 'out') -Filter *.exe -Recurse -File |
            Where-Object { $_.FullName -notlike "$releaseDir\*" } |
            ForEach-Object {
              $hash = Get-FileHash -Path $_.FullName -Algorithm SHA256
              $filename = $_.Name
              "$($hash.Hash.ToLower())  $filename" | Out-File -Append -FilePath (Join-Path $PWD 'out\checksums-windows.txt') -Encoding utf8

              $dest = Join-Path $releaseDir $filename
              Copy-Item -Path $_.FullName -Destination $dest -Force
            }

          Get-Content out/checksums-windows.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            MCP-Electron-App/out/release/*.exe
            MCP-Electron-App/out/checksums-windows.txt
          retention-days: 1

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout MCP-Electron-App
        uses: actions/checkout@v4
        with:
          path: MCP-Electron-App

      - name: Checkout fictionlab-workflow
        uses: actions/checkout@v4
        with:
          repository: RLRyals/fictionlab-workflow
          path: fictionlab-workflow
          token: ${{ secrets.WORKFLOW_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: MCP-Electron-App/package-lock.json

      - name: Install and build workflow packages
        working-directory: fictionlab-workflow
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        working-directory: MCP-Electron-App
        run: npm ci

      - name: Build TypeScript
        working-directory: MCP-Electron-App
        run: npm run build

      - name: Build macOS app
        working-directory: MCP-Electron-App
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Generate checksums
        working-directory: MCP-Electron-App
        run: |
          cd out
          find . -type f \( -name "*.dmg" -o -name "*.zip" \) -exec sh -c '
            for file; do
              filename=$(basename "$file")
              shasum -a 256 "$file" | sed "s|$file|$filename|" >> checksums-macos.txt
            done
          ' sh {} +
          cat checksums-macos.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            MCP-Electron-App/out/*.dmg
            MCP-Electron-App/out/*.zip
            MCP-Electron-App/out/checksums-macos.txt
          retention-days: 1

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MCP-Electron-App
        uses: actions/checkout@v4
        with:
          path: MCP-Electron-App

      - name: Checkout fictionlab-workflow
        uses: actions/checkout@v4
        with:
          repository: RLRyals/fictionlab-workflow
          path: fictionlab-workflow
          token: ${{ secrets.WORKFLOW_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: MCP-Electron-App/package-lock.json

      - name: Install and build workflow packages
        working-directory: fictionlab-workflow
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        working-directory: MCP-Electron-App
        run: npm ci

      - name: Build TypeScript
        working-directory: MCP-Electron-App
        run: npm run build

      - name: Build Linux app
        working-directory: MCP-Electron-App
        run: npm run package:linux

      - name: Generate checksums
        working-directory: MCP-Electron-App
        run: |
          cd out
          find . -type f \( -name "*.AppImage" -o -name "*.deb" \) -exec sh -c '
            for file; do
              filename=$(basename "$file")
              sha256sum "$file" | sed "s|$file|$filename|" >> checksums-linux.txt
            done
          ' sh {} +
          cat checksums-linux.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            MCP-Electron-App/out/*.AppImage
            MCP-Electron-App/out/*.deb
            MCP-Electron-App/out/checksums-linux.txt
          retention-days: 1

  build-claude-desktop-skill:
    name: Build Claude Desktop Skill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MCP-Electron-App
        uses: actions/checkout@v4
        with:
          path: MCP-Electron-App

      - name: Create Claude Desktop Skill ZIP
        working-directory: MCP-Electron-App
        run: |
          cd claude-desktop-skills
          zip -r fictionlab-workflow.zip fictionlab-workflow/

          # Generate checksum
          sha256sum fictionlab-workflow.zip > fictionlab-workflow.zip.sha256

          echo "Created skill ZIP:"
          ls -lh fictionlab-workflow.zip
          cat fictionlab-workflow.zip.sha256

      - name: Upload skill artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-desktop-skill
          path: |
            MCP-Electron-App/claude-desktop-skills/fictionlab-workflow.zip
            MCP-Electron-App/claude-desktop-skills/fictionlab-workflow.zip.sha256
          retention-days: 1

  create-release:
    name: Create Release
    needs: [build-windows, build-macos, build-linux, build-claude-desktop-skill]
    runs-on: ubuntu-latest
    if: always() && needs.build-windows.result == 'success' && needs.build-macos.result == 'success' && needs.build-linux.result == 'success' && needs.build-claude-desktop-skill.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: release-assets/macos

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-installer
          path: release-assets/linux

      - name: Download Claude Desktop Skill
        uses: actions/download-artifact@v4
        with:
          name: claude-desktop-skill
          path: release-assets/skill

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -lR release-assets/

      - name: Generate release notes
        id: release_notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "First release - showing all commits"
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "Changes since $PREV_TAG"
            COMMITS=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          cat << EOF > release_notes.md
          ## What's Changed

          $COMMITS

          ## Installation

          ### FictionLab App

          **Windows**: Download and run the installer executable for Windows.

          **macOS**: Download the DMG file, mount it, and drag the app to Applications.

          **Linux AppImage**: Download the AppImage file, make it executable, and run:
          \`\`\`bash
          chmod +x FictionLab-*.AppImage
          ./FictionLab-*.AppImage
          \`\`\`

          **Linux Debian/Ubuntu**: Download and install the .deb package:
          \`\`\`bash
          sudo dpkg -i fictionlab_*.deb
          \`\`\`

          ### Claude Desktop Skill

          Execute FictionLab workflows directly from Claude Desktop conversations!

          **Installation**:
          1. Download \`fictionlab-workflow.zip\`
          2. Extract the ZIP file
          3. Copy the \`fictionlab-workflow\` folder to:
             - **Windows**: \`%APPDATA%\\Claude\\skills\\\`
             - **Mac**: \`~/Library/Application Support/Claude/skills/\`
          4. Restart Claude Desktop
          5. Use \`/fictionlab-workflow\` in conversations

          See \`QUICKSTART.md\` inside the ZIP for detailed instructions.

          **Requirements**: FictionLab app must be running for the skill to work.

          ## Checksums (SHA256)

          Checksums are included in the \`checksums-*.txt\` and \`.sha256\` files for verification.

          ## Notes

          - Code signing certificates are not yet configured (Windows and macOS may show security warnings)
          - Please verify checksums before installation
          EOF

          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: FictionLab ${{ steps.get_version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, 'alpha') || contains(steps.get_version.outputs.version, 'beta') || contains(steps.get_version.outputs.version, 'rc') }}
          files: |
            release-assets/windows/*.exe
            release-assets/windows/checksums-windows.txt
            release-assets/macos/*.dmg
            release-assets/macos/*.zip
            release-assets/macos/checksums-macos.txt
            release-assets/linux/*.AppImage
            release-assets/linux/*.deb
            release-assets/linux/checksums-linux.txt
            release-assets/skill/fictionlab-workflow.zip
            release-assets/skill/fictionlab-workflow.zip.sha256

  release-complete:
    name: Release Complete
    needs: [create-release]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check release status
        run: |
          if [ "${{ needs.create-release.result }}" != "success" ]; then
            echo "::error::Release creation failed"
            echo "Release: ${{ needs.create-release.result }}"
            exit 1
          fi
          echo "::notice::Release completed successfully!"

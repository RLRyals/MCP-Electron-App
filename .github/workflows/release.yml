name: Release Electron App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

# The default GITHUB_TOKEN is read-only in this repo; creating the release
# and uploading its assets needs contents: write.
permissions:
  contents: write

# mea-5h0: no Actions artifacts anywhere in this workflow. The account's
# artifact storage quota ran out (2026-10) and every upload-artifact step
# failed, so a release could not ship at all. Instead, prepare-release
# opens a DRAFT release, each build job uploads its installers straight to
# it, and publish-release flips it public once the required builds are
# green. electron-updater never sees a draft, so a half-uploaded release
# can't be offered as an update.
jobs:
  prepare-release:
    name: Prepare Draft Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # The "What's Changed" changelog is auto-generated by GitHub from PR
      # titles via --generate-notes on the draft below (bead mea-1j9 -- the
      # in-app What's New panel renders that body). This file is prepended
      # to the generated notes and only carries the static
      # installation/checksum guidance.
      - name: Generate release notes
        run: |
          cat << EOF > release_notes.md
          ## Installation

          **Windows (x64 and ARM64)**: Download and run the installer executable for your architecture (the filename includes \`x64\` or \`arm64\`). Not sure which you have? Settings > System > About > "System type".

          **macOS (Apple Silicon)**: Download the DMG file, mount it, and drag the app to Applications. Unsigned build -- see the Notes section below for the Gatekeeper steps.

          **Linux AppImage**: Download the AppImage file, make it executable, and run:
          \`\`\`bash
          chmod +x FictionLab-*.AppImage
          ./FictionLab-*.AppImage
          \`\`\`

          **Linux Debian/Ubuntu**: Download and install the .deb package:
          \`\`\`bash
          sudo dpkg -i fictionlab_*.deb
          \`\`\`

          ## Checksums (SHA256)

          Checksums are included in the \`checksums-*.txt\` files for verification.

          ## Notes

          - Code signing certificates are not yet configured for any platform (Windows and macOS builds are unsigned and will show OS security warnings -- SmartScreen on Windows, Gatekeeper on macOS). See TESTING.md for the exact click-through steps on each OS.
          - Already-installed FictionLab apps (Windows x64) auto-check for this release and install it in the background -- unsigned NSIS updates still work with electron-updater; expect the same SmartScreen prompt on the silent install as on a fresh manual install.
          - Windows ARM64 and the win-arm64 CI smoke test are new in this release; if the ARM64 asset is missing from this release, its build did not complete in time and shipped without blocking the other platforms -- check the release workflow run for the \`Build Windows ARM64\` job status.
          - Please verify checksums before installation
          EOF

          cat release_notes.md

      # mea-36t: the tag is the resolved version, not github.ref_name, so a
      # workflow_dispatch from any ref still tags the release correctly.
      # --target only applies when the tag doesn't exist yet (dispatch);
      # GitHub creates the tag when the draft is published.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > existing.txt 2>/dev/null; then
            if [ "$(cat existing.txt)" = "true" ]; then
              echo "::notice::Draft release $TAG already exists (re-run); reusing it."
              exit 0
            fi
            echo "::error::Release $TAG is already published; bump the version instead of re-releasing."
            exit 1
          fi
          prerelease=""
          case "$TAG" in *alpha*|*beta*|*rc*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" \
            --title "FictionLab $TAG" \
            --notes-file release_notes.md --generate-notes \
            $prerelease

  build-windows:
    name: Build Windows
    needs: prepare-release
    # Pinned (mea-3ya): windows-latest (windows-2025-vs2026, image 20261007+) crashes
    # Electron 28 at boot (GPU sandbox, 0xC0000005). Temporary until Electron is upgraded.
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm run test:ci

      - name: Run full test suite (informational)
        id: full_tests
        continue-on-error: true
        run: npm test

      - name: Note pre-existing test failures
        if: steps.full_tests.outcome == 'failure'
        run: |
          echo "::warning::Full suite (npm test) has pre-existing failures tracked in issue #176; not blocking this release build. The required gate above (npm run test:ci) covers the currently-green suites and does block on regressions there. See the 'Run full test suite' step log for detail."

      - name: Install Playwright browsers
        run: |
          npx playwright install chromium --with-deps

      - name: Run Electron E2E smoke tests (issue #208, bead mea-eed)
        # playwright.config.ts testDir is e2e/, so this runs every *.spec.ts
        # there: the launch-only smoke test (smoke.spec.ts) plus the
        # pluginless core smoke test (pluginless.spec.ts) that gates a
        # zero-plugins install against dangling plugin-view references.
        run: |
          npm run test:e2e

      - name: Build Windows app
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Generate checksums
        shell: powershell
        run: |
          $releaseDir = Join-Path $PWD 'out\release'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          # Issue #223: this used to be -Recurse over the whole 'out' tree, which
          # also swept up out/win-unpacked/FictionLab.exe (bare app exe) plus NSIS
          # helper binaries (elevate.exe, pagent.exe) and shipped them as release
          # assets alongside the real installer. electron-builder's nsis target
          # writes the actual installer directly under out/ (default artifactName
          # "${productName}-Setup-${version}-${arch}.${ext}" (no spaces, mea-8yi: GitHub
          # rewrites spaces to dots in asset names, which broke latest.yml URLs)). Scoping to the top level of out/ (no -Recurse)
          # already excludes win-unpacked/; the *Setup*.exe filter is a second,
          # explicit guard against any other top-level .exe.
          Get-ChildItem -Path (Join-Path $PWD 'out') -Filter '*Setup*.exe' -File |
            ForEach-Object {
              $hash = Get-FileHash -Path $_.FullName -Algorithm SHA256
              $filename = $_.Name
              "$($hash.Hash.ToLower())  $filename" | Out-File -Append -FilePath (Join-Path $PWD 'out\checksums-windows.txt') -Encoding utf8

              $dest = Join-Path $releaseDir $filename
              Copy-Item -Path $_.FullName -Destination $dest -Force
            }

          Get-Content out/checksums-windows.txt

          # bead mea-hbi: electron-updater's NSIS provider needs latest.yml
          # (points it at the installer + its blockmap) alongside the exe on
          # the GitHub release. package.json's build.publish + `npm run
          # package:win` (still `--publish never`, no upload) is enough for
          # electron-builder to WRITE these locally -- see PublishManager's
          # isWriteUpdateInfo gate, which fires independently of the
          # never-publish flag. Only the x64 job's latest.yml gets published
          # (see build-windows-arm64 below): electron-updater expects exactly
          # one `latest.yml` per release, and x64 is the primary target.
          Get-ChildItem -Path (Join-Path $PWD 'out') -Filter 'latest.yml' -File |
            ForEach-Object { Copy-Item -Path $_.FullName -Destination $releaseDir -Force }
          Get-ChildItem -Path (Join-Path $PWD 'out') -Filter '*.exe.blockmap' -File |
            ForEach-Object { Copy-Item -Path $_.FullName -Destination $releaseDir -Force }

      - name: Upload to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.version }}
        run: |
          shopt -s nullglob
          files=(out/release/*Setup*.exe out/release/*.blockmap out/release/latest.yml out/checksums-windows.txt)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::No Windows release files found"; exit 1; fi
          for f in "${files[@]}"; do echo "uploading: $f"; done
          # No --clobber (mea-90i): a filename another job already uploaded
          # must fail loudly, never silently replace bytes latest.yml points at.
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY"

  build-windows-arm64:
    name: Build Windows ARM64
    needs: prepare-release
    # Hosted arm64 Windows runner (bead mea-0um). Native arm64 host, not a
    # cross-build from windows-latest -- electron-builder + the NSIS tooling
    # it shells out to run fine under this runner the same way they do on
    # windows-latest (Windows-on-ARM handles the x64 helper binaries via
    # built-in emulation).
    runs-on: windows-11-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm run test:ci

      - name: Run full test suite (informational)
        id: full_tests
        continue-on-error: true
        run: npm test

      - name: Note pre-existing test failures
        if: steps.full_tests.outcome == 'failure'
        run: |
          echo "::warning::Full suite (npm test) has pre-existing failures tracked in issue #176; not blocking this release build. The required gate above (npm run test:ci) covers the currently-green suites and does block on regressions there. See the 'Run full test suite' step log for detail."

      - name: Install Playwright browsers
        run: |
          npx playwright install chromium --with-deps

      - name: Run Electron E2E smoke tests (bead mea-0um)
        # Same suite as the win-x64 job (smoke.spec.ts + pluginless.spec.ts).
        # windows-11-arm is a GUI-capable hosted runner like windows-latest,
        # so no xvfb wrapper is needed here (unlike ubuntu-latest below).
        # NOTE: this is the first time this suite runs on windows-11-arm --
        # if Playwright's chromium download has no win32-arm64 binary this
        # step will fail loudly on the first real CI run rather than silently
        # skip; that is the intended "documented, not silent" failure mode
        # per bead mea-0um until verified.
        run: |
          npm run test:e2e

      - name: Build Windows ARM64 app
        run: npm run package:win-arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Generate checksums
        shell: powershell
        run: |
          $releaseDir = Join-Path $PWD 'out\release'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          # Same *Setup*.exe scoping as the win-x64 job (issue #223 lesson).
          # mea-90i: `--arm64` on the CLI makes electron-builder ALSO emit an
          # x64 installer (package.json pins nsis arch x64) plus a combined
          # un-suffixed one, whose bytes differ from the x64 job's same-named
          # file and overwrote it on the release (sha512 mismatch vs latest.yml).
          # This job ships ONLY the arm64 installer.
          Get-ChildItem -Path (Join-Path $PWD 'out') -Filter '*Setup*-arm64.exe' -File |
            ForEach-Object {
              $hash = Get-FileHash -Path $_.FullName -Algorithm SHA256
              $filename = $_.Name
              "$($hash.Hash.ToLower())  $filename" | Out-File -Append -FilePath (Join-Path $PWD 'out\checksums-windows-arm64.txt') -Encoding utf8

              $dest = Join-Path $releaseDir $filename
              Copy-Item -Path $_.FullName -Destination $dest -Force
            }

          Get-Content out/checksums-windows-arm64.txt

      - name: Upload to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.version }}
        run: |
          shopt -s nullglob
          files=(out/release/*Setup*-arm64.exe out/checksums-windows-arm64.txt)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::No Windows ARM64 release files found"; exit 1; fi
          for f in "${files[@]}"; do echo "uploading: $f"; done
          # No --clobber (mea-90i): a filename another job already uploaded
          # must fail loudly, never silently replace bytes latest.yml points at.
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY"

  build-macos:
    name: Build macOS
    needs: prepare-release
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm run test:ci

      - name: Run full test suite (informational)
        id: full_tests
        continue-on-error: true
        run: npm test

      - name: Note pre-existing test failures
        if: steps.full_tests.outcome == 'failure'
        run: |
          echo "::warning::Full suite (npm test) has pre-existing failures tracked in issue #176; not blocking this release build. The required gate above (npm run test:ci) covers the currently-green suites and does block on regressions there. See the 'Run full test suite' step log for detail."

      - name: Install Playwright browsers
        run: |
          npx playwright install chromium --with-deps

      - name: Run Electron E2E smoke tests (bead mea-0um)
        # macos-latest is GUI-capable out of the box (macOS CI runners always
        # have a windowserver, unlike Linux) -- no xvfb wrapper needed, same
        # as the win-x64 job.
        run: |
          npm run test:e2e

      - name: Build macOS app
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Generate checksums
        run: |
          cd out
          find . -type f \( -name "*.dmg" -o -name "*.zip" \) -exec sh -c '
            for file; do
              filename=$(basename "$file")
              shasum -a 256 "$file" | sed "s|$file|$filename|" >> checksums-macos.txt
            done
          ' sh {} +
          cat checksums-macos.txt

      - name: Upload to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.version }}
        run: |
          shopt -s nullglob
          files=(out/*.dmg out/*.zip out/*.zip.blockmap out/latest-mac.yml out/checksums-macos.txt)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::No macOS release files found"; exit 1; fi
          for f in "${files[@]}"; do echo "uploading: $f"; done
          # No --clobber (mea-90i): a filename another job already uploaded
          # must fail loudly, never silently replace bytes latest.yml points at.
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY"

  build-linux:
    name: Build Linux
    needs: prepare-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm run test:ci

      - name: Run full test suite (informational)
        id: full_tests
        continue-on-error: true
        run: npm test

      - name: Note pre-existing test failures
        if: steps.full_tests.outcome == 'failure'
        run: |
          echo "::warning::Full suite (npm test) has pre-existing failures tracked in issue #176; not blocking this release build. The required gate above (npm run test:ci) covers the currently-green suites and does block on regressions there. See the 'Run full test suite' step log for detail."

      - name: Install Playwright browsers
        run: |
          npx playwright install chromium --with-deps

      - name: Run Electron E2E smoke tests (bead mea-0um)
        # ubuntu-latest is headless -- Electron (and Playwright's underlying
        # CDP connection to it) needs a display server, so this runs under
        # xvfb-run the same way an Electron app would in any headless Linux
        # CI environment. xvfb itself comes from the --with-deps install
        # above.
        run: |
          xvfb-run --auto-servernum npm run test:e2e

      - name: Build Linux app
        run: npm run package:linux

      - name: Generate checksums
        run: |
          cd out
          find . -type f \( -name "*.AppImage" -o -name "*.deb" \) -exec sh -c '
            for file; do
              filename=$(basename "$file")
              sha256sum "$file" | sed "s|$file|$filename|" >> checksums-linux.txt
            done
          ' sh {} +
          cat checksums-linux.txt

      - name: Upload to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.version }}
        run: |
          shopt -s nullglob
          files=(out/*.AppImage out/*.deb out/latest-linux.yml out/checksums-linux.txt)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::No Linux release files found"; exit 1; fi
          for f in "${files[@]}"; do echo "uploading: $f"; done
          # No --clobber (mea-90i): a filename another job already uploaded
          # must fail loudly, never silently replace bytes latest.yml points at.
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY"


  publish-release:
    name: Publish Release
    # build-windows-arm64 is listed as a dependency (so it's scheduled and
    # awaited alongside the others) but deliberately NOT required to succeed
    # in the `if:` gate below (bead mea-0um). windows-11-arm is the newest,
    # least-proven runner class; if it fails, the release still ships for
    # the other three platforms and simply omits the win-arm64 asset -- a
    # documented skip, not a silent one.
    needs: [prepare-release, build-windows, build-windows-arm64, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: always() && needs.prepare-release.result == 'success' && needs.build-windows.result == 'success' && needs.build-macos.result == 'success' && needs.build-linux.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.version }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.size)\t\(.name)"'

      - name: Publish draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.version }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      # mea-8yi: assert every url:/path: in the update manifests resolves under
      # the release download URL (latest.yml once said "-" while the uploaded
      # asset said "." and every auto-update 404'd).
      - name: Verify update manifests resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.version }}
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          fail=0
          for m in latest.yml latest-mac.yml latest-linux.yml; do
            curl -fsSL "$base/$m" -o "$m" || { echo "::error::$m missing from release"; fail=1; continue; }
            for f in $(grep -E '^\s*(-\s+)?(url|path):' "$m" | sed -E 's/^\s*(-\s+)?(url|path):\s*//; s/["'"'"']//g' | sort -u); do
              case "$f" in http*) u="$f" ;; *) u="$base/$f" ;; esac
              code=$(curl -s -o /dev/null -w '%{http_code}' -IL "$u")
              if [ "$code" != "200" ] && [ "$code" != "302" ]; then
                echo "::error::$m references $f -> HTTP $code"; fail=1
              else
                echo "ok: $m -> $f"
              fi
            done
          done
          exit $fail

      # mea-90i: published bytes must match the manifests (size + sha512) and
      # checksums-*.txt (sha256).
      - name: Verify published asset integrity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.version }}
        run: |
          mkdir -p verify
          gh release download "$TAG" --repo "${{ github.repository }}" --dir verify --clobber
          cd verify
          node "$GITHUB_WORKSPACE/scripts/verify-release-assets.js"

  release-complete:
    name: Release Complete
    needs: [prepare-release, publish-release]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check release status
        run: |
          if [ "${{ needs.publish-release.result }}" != "success" ]; then
            echo "::error::Release failed (publish: ${{ needs.publish-release.result }}). If a draft release ${{ needs.prepare-release.outputs.version }} exists it was left unpublished -- fix the failing build and re-run failed jobs."
            exit 1
          fi
          echo "::notice::Release completed successfully!"

name: Build Electron App

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            platform: win
            artifact_name: windows-build
            build_script: package:win
          - os: macos-latest
            platform: mac
            artifact_name: macos-build
            build_script: package:mac
          - os: ubuntu-latest
            platform: linux
            artifact_name: linux-build
            build_script: package:linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout MCP-Electron-App
        uses: actions/checkout@v4
        with:
          path: MCP-Electron-App

      - name: Checkout fictionlab-workflow
        uses: actions/checkout@v4
        with:
          repository: RLRyals/fictionlab-workflow
          path: fictionlab-workflow
          token: ${{ secrets.WORKFLOW_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: MCP-Electron-App/package-lock.json

      - name: Install and build workflow packages
        working-directory: fictionlab-workflow
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        working-directory: MCP-Electron-App
        run: npm ci

      - name: Build TypeScript
        working-directory: MCP-Electron-App
        run: npm run build

      - name: Build Electron app
        working-directory: MCP-Electron-App
        run: npm run ${{ matrix.build_script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Generate checksums (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        working-directory: MCP-Electron-App
        run: |
          Get-ChildItem -Path out -Filter *.exe -Recurse | ForEach-Object {
            $hash = Get-FileHash -Path $_.FullName -Algorithm SHA256
            $relativePath = $_.FullName.Replace((Get-Location).Path + '\out\', '')
            "$($hash.Hash.ToLower())  $relativePath" | Out-File -Append -FilePath out/checksums.txt -Encoding utf8
          }
          if (Test-Path out/checksums.txt) {
            Get-Content out/checksums.txt
          }

      - name: Generate checksums (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: MCP-Electron-App
        run: |
          cd out
          find . -type f \( -name "*.dmg" -o -name "*.zip" \) -exec shasum -a 256 {} \; > checksums.txt
          cat checksums.txt

      - name: Generate checksums (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: MCP-Electron-App
        run: |
          cd out
          find . -type f \( -name "*.AppImage" -o -name "*.deb" \) -exec sha256sum {} \; > checksums.txt
          cat checksums.txt

      - name: List build artifacts
        shell: bash
        working-directory: MCP-Electron-App
        run: |
          echo "Build artifacts:"
          ls -lR out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            MCP-Electron-App/out/*.exe
            MCP-Electron-App/out/*.dmg
            MCP-Electron-App/out/*.zip
            MCP-Electron-App/out/*.AppImage
            MCP-Electron-App/out/*.deb
            MCP-Electron-App/out/checksums.txt
          retention-days: 7
          if-no-files-found: error

  build-summary:
    name: Build Summary
    needs: build
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::One or more builds failed"
            exit 1
          fi
          echo "::notice::All builds completed successfully!"

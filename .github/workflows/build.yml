name: Build Electron App

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            platform: win
            artifact_name: windows-build
            build_script: package:win
          - os: macos-latest
            platform: mac
            artifact_name: macos-build
            build_script: package:mac
          - os: ubuntu-latest
            platform: linux
            artifact_name: linux-build
            build_script: package:linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm run test:ci

      - name: Run full test suite (informational)
        id: full_tests
        continue-on-error: true
        run: npm test

      - name: Note pre-existing test failures
        if: steps.full_tests.outcome == 'failure'
        run: |
          echo "::warning::Full suite (npm test) has pre-existing failures tracked in issue #176; not blocking this build. The required gate above (npm run test:ci) covers the currently-green suites and does block on regressions there. See the 'Run full test suite' step log for detail."

      - name: Build Electron app
        run: npm run ${{ matrix.build_script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Generate checksums (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Get-ChildItem -Path out -Filter *.exe -Recurse | ForEach-Object {
            $hash = Get-FileHash -Path $_.FullName -Algorithm SHA256
            $relativePath = $_.FullName.Replace((Get-Location).Path + '\out\', '')
            "$($hash.Hash.ToLower())  $relativePath" | Out-File -Append -FilePath out/checksums.txt -Encoding utf8
          }
          if (Test-Path out/checksums.txt) {
            Get-Content out/checksums.txt
          }

      - name: Generate checksums (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd out
          find . -type f \( -name "*.dmg" -o -name "*.zip" \) -exec shasum -a 256 {} \; > checksums.txt
          cat checksums.txt

      - name: Generate checksums (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd out
          find . -type f \( -name "*.AppImage" -o -name "*.deb" \) -exec sha256sum {} \; > checksums.txt
          cat checksums.txt

      - name: List build artifacts
        shell: bash
        run: |
          echo "Build artifacts:"
          ls -lR out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            out/*.exe
            out/*.dmg
            out/*.zip
            out/*.AppImage
            out/*.deb
            out/checksums.txt
          retention-days: 7
          if-no-files-found: error

  build-summary:
    name: Build Summary
    needs: build
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::One or more builds failed"
            exit 1
          fi
          echo "::notice::All builds completed successfully!"

  auto-tag-release:
    name: Auto-tag App Release
    # mea-36t: on push to develop, once all three OS builds are green, tag
    # the commit v<package.json version> if that tag doesn't already exist,
    # then dispatch release.yml for it -- no bead, no manual tag push.
    # `needs: build` gates this on the matrix job (all 3 OS legs), so a
    # broken commit never gets tagged. Never runs on pull_request (a PR's
    # version bump has no commit on develop yet to tag) or on pushes to
    # main/other branches.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag
      actions: write # workflow_dispatch release.yml (see script comment on why push-tag alone can't trigger it)
    concurrency:
      # Serialize auto-tagging across overlapping pushes to develop so two
      # near-simultaneous merges can't race to tag/push the same version twice.
      group: auto-tag-release
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Tags aren't fetched by default; the idempotency check needs the
          # remote tag list to know whether this version was already released.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git identity for tagging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Auto-tag and dispatch release if the version isn't tagged yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/auto-tag-release.js
